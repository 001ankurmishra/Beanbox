[project]
name = "beanbox-backend"
version = "1.0.0"
description = "BeanBox India Specialty Coffee E-Commerce FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.2.0",
  "pyjwt[crypto]>=2.9.0",
  "bcrypt>=4.2.0",
  "argon2-cffi>=23.1.0",
  "pyotp>=2.9.0",
  "qrcode>=8.0",
  "cryptography>=43.0.0",
  "httpx>=0.27.2",
  "stripe>=11.1.0",
  "python-multipart>=0.0.12",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
